<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Sem conexão</title>
<style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f5f5f5;color:#333}.box{text-align:center}button{padding:12px 24px;font-size:16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}</style></head>
<body><div class="box"><h2>Sem conexão com a internet</h2><p>Verifique a internet. Tentando de novo a cada 10 segundos...</p>
<button onclick="window.electronAPI.retry()">Tentar agora</button></div>
<script>setInterval(() => window.electronAPI.retry(), 10000);</script></body></html>
